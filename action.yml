name: "UmbHost Web Deploy"
description: "Deploy projects directly to UmbHost"
inputs:
  website-name:
    description: "IIS website name"
    required: true
  server-computer-name:
    description: "IIS server computer name"
    required: true
  server-username:
    description: "IIS server username"
    required: true
  server-password:
    description: "IIS server password"
    required: true
  source-path:
    description: "The source directory for payload"
    required: false
    default: '_build'
  source-paramFile:
    description: "The location of the SetParameters.xml file"
    required: true
    default: '""'
  source-fileName:
    description: "The name of the file to be deployed"
    required: true
    default: 'Umbraco.Web.zip'
runs:
  using: "composite"
  steps:
    # Inputs travel as environment variables, so nothing in one is read as code.
    - name: Check Deployment Files
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        WEB_DEPLOY_SOURCE: ${{ inputs.source-path }}
        WEB_DEPLOY_PACKAGE: ${{ inputs.source-fileName }}
        WEB_DEPLOY_PARAMETERS: ${{ inputs.source-paramFile }}
      run: |
        . (Join-Path $env:ACTION_PATH 'Scripts/DeploymentFiles.ps1')
        $null = Get-DeploymentFiles
    - name: Stop Application Pool
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        WEB_DEPLOY_SITE: ${{ inputs.website-name }}
        WEB_DEPLOY_COMPUTER: ${{ inputs.server-computer-name }}
        WEB_DEPLOY_USERNAME: ${{ inputs.server-username }}
        WEB_DEPLOY_PASSWORD: ${{ inputs.server-password }}
      run: '& (Join-Path $env:ACTION_PATH "Scripts/Set-ApplicationPool.ps1") -recycleMode StopAppPool'
    - name: Deploy Application
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        WEB_DEPLOY_SITE: ${{ inputs.website-name }}
        WEB_DEPLOY_COMPUTER: ${{ inputs.server-computer-name }}
        WEB_DEPLOY_USERNAME: ${{ inputs.server-username }}
        WEB_DEPLOY_PASSWORD: ${{ inputs.server-password }}
        WEB_DEPLOY_SOURCE: ${{ inputs.source-path }}
        WEB_DEPLOY_PACKAGE: ${{ inputs.source-fileName }}
        WEB_DEPLOY_PARAMETERS: ${{ inputs.source-paramFile }}
      run: '& (Join-Path $env:ACTION_PATH "Scripts/Deploy-ApplicationPackage.ps1")'
    - name: Start Application Pool
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        WEB_DEPLOY_SITE: ${{ inputs.website-name }}
        WEB_DEPLOY_COMPUTER: ${{ inputs.server-computer-name }}
        WEB_DEPLOY_USERNAME: ${{ inputs.server-username }}
        WEB_DEPLOY_PASSWORD: ${{ inputs.server-password }}
      run: '& (Join-Path $env:ACTION_PATH "Scripts/Set-ApplicationPool.ps1") -recycleMode StartAppPool'
branding:
  icon: 'server'
  color: 'blue'
